# pnpm 12 reads its settings from this file. ArcheLab is a single package.
# Every key must be a known pnpm setting: unknown keys fail commands (SKILL.md landmine 11).

# Exact versions only, dev dependencies included (ADR 0002).
savePrefix: ""

# Dependency build scripts are off unless approved here, each with a reason.
allowBuilds:
  # Image optimization is never used (images.unoptimized, SKILL.md landmine 2).
  sharp: false
  # Prebuilt native bindings ship as optional dependencies; the postinstall fallback is not needed.
  unrs-resolver: false
  # Pulled in by the Vercel CLI's builders. The platform binary ships as an optional
  # dependency (@esbuild/<platform>), so the postinstall check and fallback are not needed.
  esbuild: false

# These plugins, bundled by eslint-config-next, do not list ESLint 10 in their peer ranges yet.
# Next.js documents ESLint 10 as supported (ADR 0002).
peerDependencyRules:
  allowedVersions:
    eslint-plugin-react>eslint: "10"
    eslint-plugin-jsx-a11y>eslint: "10"
    eslint-plugin-import>eslint: "10"
