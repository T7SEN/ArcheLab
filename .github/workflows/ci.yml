# CI and deploys (ADR 0003). Vercel cannot build with Node 26 and pnpm 12, so this
# workflow builds and deploys prebuilt output. Actions are pinned to commit SHAs (ADR 0002).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly production rebuild, so NEXON data in the built pages stays far inside
  # the 30-day limit (Nexon API Terms §8.7, ADR 0008). GitHub runs schedules on
  # the default branch, in UTC; the minute avoids the busy start of the hour.
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a production deploy halfway; superseded pull request runs can stop.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Runs `next typegen` first, which generates next-env.d.ts.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      # Firefox and WebKit run the share-link tests only (ADR 0015).
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy
    needs: checks
    # Pull requests from forks get no secrets, so they get no preview.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TARGET: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pull Vercel project settings
        run: pnpm exec vercel pull --yes --environment="$VERCEL_TARGET" --token="$VERCEL_TOKEN"
      - name: Build with Vercel
        run: |
          if [ "$VERCEL_TARGET" = "production" ]; then
            pnpm exec vercel build --prod --token="$VERCEL_TOKEN"
          else
            pnpm exec vercel build --token="$VERCEL_TOKEN"
          fi
      - name: Deploy prebuilt output
        id: deploy
        run: |
          if [ "$VERCEL_TARGET" = "production" ]; then
            url="$(pnpm exec vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          else
            url="$(pnpm exec vercel deploy --prebuilt --token="$VERCEL_TOKEN")"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed ($VERCEL_TARGET): $url" >> "$GITHUB_STEP_SUMMARY"
